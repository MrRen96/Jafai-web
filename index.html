<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#111111">
    <title>JAFAI — Just Another Fucking AI</title>
    <link rel="icon" href="jafai-logo.png" type="image/png">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Open chat history" aria-controls="history-sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12h16m-7-7 7 7-7 7"/></svg>
    </button>
    <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Close chat history" tabindex="-1" hidden></button>
    <aside class="history-sidebar sidebar-closed" id="history-sidebar" aria-label="Chat history" aria-hidden="true" inert>
      <div class="sidebar-heading">
        <div class="sidebar-brand">
          <img class="sidebar-wordmark" src="jafai-wordmark.png" alt="JAFAI">
        </div>
        <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Close chat history"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 12H4m7-7-7 7 7 7"/></svg></button>
      </div>
      <span class="eyebrow">JAFAI / HISTORY</span>
      <button class="new-chat" id="new-chat" type="button">+ New Chat</button>
      <nav class="session-list" id="session-list" aria-label="Saved chats"></nav>
      <div class="sidebar-actions" role="group" aria-label="Chat files">
        <button class="sidebar-action" id="import-chat" type="button" aria-label="Import chat"><span aria-hidden="true">+</span> Import</button>
        <button class="sidebar-action" id="export-chat" type="button" aria-label="Export current chat" disabled><span aria-hidden="true">↑</span> Export</button>
        <input id="import-file" type="file" accept=".txt,text/plain" aria-label="Import a JAFAI text chat" hidden>
      </div>
      <div class="sidebar-footer">
        <button class="settings-toggle" id="settings-toggle" type="button" aria-label="Open settings" aria-haspopup="dialog" aria-controls="settings-dialog" aria-expanded="false">⚙︎</button>
        <p class="vault-caption">LOCAL VAULT / THIS BROWSER</p>
      </div>
    </aside>
    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-heading">
        <h2 class="eyebrow" id="settings-title">SETTINGS</h2>
        <button class="settings-close" id="settings-close" type="button" aria-label="Close settings" autofocus>×</button>
      </div>
      <p class="settings-note" id="settings-install-status">Use your browser's install or Add to Home Screen menu if installation is not offered here.</p>
      <button class="install-app" id="install-app" type="button">[ Install App ]</button>
    </dialog>
    <div class="app">
      <header class="header">
        <div class="header-brand">
        </div>
      </header>

      <div class="chat-panel">
        <main class="conversation" aria-label="Conversation">
          <div class="messages" id="messages" role="log" aria-label="Chat messages" aria-live="polite" aria-relevant="additions">
            <section class="empty-state" id="empty-state">
              <h1>Less noise.<br>More conversation.</h1>
            </section>
          </div>
        </main>

        <div class="composer-dock">
          <form class="composer" id="chat-form">
            <button class="attach-image" id="attach-image" type="button" aria-label="Attach image" title="Attach JPEG, PNG, GIF or WebP (maximum 1 MB)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m8 13 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l9-9M6 15l8-8"/></svg></button>
            <input id="image-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
            <label class="sr-only" for="message-input">Message JAFAI</label>
            <textarea id="message-input" name="message" placeholder="Say what's on your mind..." rows="1" maxlength="10000" enterkeyhint="send" aria-describedby="keyboard-hint"></textarea>
            <button class="send-button" type="submit" aria-label="Send message" title="Send message" disabled>
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m5 12 7-7 7 7M12 5v14"/>
              </svg>
            </button>
          </form>
          <div class="image-attachment" id="image-attachment" hidden><img id="image-preview" alt="Selected image"><span id="image-name"></span><button id="remove-image" type="button" aria-label="Remove attached image">×</button></div>
          <p class="image-status" id="image-status" role="status" hidden></p>
          <p class="storage-status" id="storage-status" role="status" hidden></p>
          <div class="composer-footer">
            <p class="keyboard-hint" id="keyboard-hint">Enter to send <span aria-hidden="true">·</span> Shift + Enter for a new line</p>
            <footer>
              <span class="status-dot" aria-hidden="true"></span>
              <p>Cloud API Active. Do not input sensitive data.</p>
            </footer>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
